[project]
name = "cyber-toolbox"
version = "0.1.0"
description = "CTF / 日常安全常用小工具集合：编解码、哈希、时间戳、IP 计算等"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
toolbox = "toolbox.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
